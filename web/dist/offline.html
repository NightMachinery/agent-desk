<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agent-desk: offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f6f6f7; color: #16161b;
      }
      @media (prefers-color-scheme: dark) { body { background: #0d0e11; color: #ececf0; } }
      p { color: #8a8a96; max-width: 30em; padding: 0 24px; }
      a { display: inline-block; margin-top: 8px; padding: 8px 16px; border-radius: 8px; background: #c2410c; color: #fff; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <div>
      <h1>The desk is out of reach</h1>
      <p>This device cannot reach the machine that serves it. Check the network or the VPN, then try again.</p>
      <a href="./">Try again</a>
    </div>
  </body>
</html>
